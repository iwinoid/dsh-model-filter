# dsh-model-filter 的 bundle 层：把插件行插进 harness 组合。
#
# 两种挂法二选一，不要同时用（同一个 id 被 insert 两次会冲突）：
#
#  A. 推荐：不把本包写进 profile 的 dsh.profile.bundles，直接在自己的
#     profile cordis.patch.yml（patch 层，在所有 bundle 之后应用）里 insert：
#
#       - insert:
#           - id: dsh-model-filter
#             name: dsh-model-filter
#             config:
#               hideModels:
#                 deepseek-account: [deepseek-v4-pro]
#
#  B. 把 "dsh-model-filter" 加进 profile package.json 的 dsh.profile.bundles，
#     由本文件给出默认配置（下面这份）。想改隐藏清单时，在自己的 patch 层写：
#
#       - id: dsh-model-filter
#         config:
#           hideModels:
#             deepseek-account: [deepseek-v4-pro, deepseek-chat]
#
#     ⚠️ id 型 patch 是「整体替换该行的 config」（dsh-app-boot 的
#     applyEntryPatches：target[key] = value），不是深合并，hideModels 必须写全。
- insert:
    - id: dsh-model-filter
      name: dsh-model-filter
